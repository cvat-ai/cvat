{{ define "main" }}
<article class="td-content container cvat-release-notes-page cvat-release-note">
  <p><a href="{{ "/announcements/" | absURL }}">← All announcements</a></p>
  <h1>{{ .Title }}</h1>
  {{ partial "announcements/availability.html" . }}

  {{ .Content }}
</article>
{{ end }}
