
## To work with cloudpirates redis
cvat:
  backend:
    redisInmemHostOverride: "cvat-redis"

## Move PVC from bitnami to cloudpirates
redis:
  persistence:
    existingClaim: redis-data-cvat-redis-master-0

traefik:
  enabled: true
# On macos need tunnel, todo add this to the docs.
#  service:
