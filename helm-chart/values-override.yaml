#ingress:
#  enabled: true
#
#traefik:
#  enabled: true

postgresql:
  secret:
    password: cvat
    postgres_password: cvat
    replication_password: cvat

ingress:
  enabled: true


# todo add this to the docs.
# fix for Traefik missing CRDs if you have installed chart w/o Traefik enabled and enabled it later.
# helm upgrade will not install CRDs
#➜  helm-chart git:(DEV-1054) ✗ helm show crds ./charts/traefik-37.3.0.tgz > /tmp/traefik-crds.yaml
#➜  helm-chart git:(DEV-1054) ✗ kubectl apply --server-side -f /tmp/traefik-crds.yaml

# Minio access
smokescreen:
  opts: '--allow-address=localhost:9000'
