# CVAT-owned CSP policies. Deployment adapters select a profile and serialize
# these directive/source lists for the response (CSP context) owner.
# CSP keywords retain their required single quotes inside double-quoted YAML strings, for example ["'self'"].
cvat-csp:
  mainSpa:
    default-src: ["'none'"]
    object-src: ["'none'"]
    base-uri: ["'none'"]
    frame-ancestors: ["'none'"]
    script-src: ["'self'", "'unsafe-eval'"]
    style-src: ["'self'", "'unsafe-inline'", 'https://fonts.googleapis.com']
    font-src: ["'self'", 'https://fonts.gstatic.com']
    img-src: ["'self'", 'data:', 'blob:']
    media-src: ["'self'", 'blob:']
    connect-src: ["'self'", 'data:']
    worker-src: ["'self'"]
  imageUnzipWorker:
    default-src: ["'none'"]
    script-src: ["'self'"]
  videoDecoderWorker:
    default-src: ["'none'"]
    script-src: ["'wasm-unsafe-eval'"]
    connect-src: ["'self'"]
  downloadWorker:
    default-src: ["'none'"]
    connect-src: ["'self'"]
  polygonSimplifierWorker:
    default-src: ["'none'"]
    script-src: ["'self'", "'unsafe-eval'"]
    connect-src: ['data:']
  samInferenceWorker:
    default-src: ["'none'"]
    script-src: ["'self'", "'wasm-unsafe-eval'"]
    connect-src: ["'self'"]

cvat-csp-next:
  mainSpa:
    default-src: ["'none'"]
    object-src: ["'none'"]
    base-uri: ["'none'"]
    frame-ancestors: ["'none'"]
    script-src: ["'self'", "'unsafe-eval'"]
    style-src: ["'self'", "'unsafe-inline'", 'https://fonts.googleapis.com']
    font-src: ["'self'", 'https://fonts.gstatic.com']
    img-src: ["'self'", 'data:', 'blob:']
    media-src: ["'self'", 'blob:']
    connect-src: ["'self'", 'data:']
    worker-src: ["'self'"]
  imageUnzipWorker:
    default-src: ["'none'"]
    script-src: ["'self'"]
  videoDecoderWorker:
    default-src: ["'none'"]
    script-src: ["'wasm-unsafe-eval'"]
    connect-src: ["'self'"]
  downloadWorker:
    default-src: ["'none'"]
    connect-src: ["'self'"]
  polygonSimplifierWorker:
    default-src: ["'none'"]
    script-src: ["'self'", "'unsafe-eval'"]
    connect-src: ['data:']
  samInferenceWorker:
    default-src: ["'none'"]
    script-src: ["'self'", "'wasm-unsafe-eval'"]
    connect-src: ["'self'"]
