name: Upload Allure results to TestOps

on:
  workflow_call:
    inputs:
      ref:
        description: Branch or commit tested by the calling workflow
        type: string
        required: true
    secrets:
      ALLURE_TOKEN:
        required: false

permissions:
  actions: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Check TestOps configuration
        id: config
        env:
          ALLURE_ENDPOINT: ${{ vars.ALLURE_ENDPOINT }}
          ALLURE_PROJECT_ID: ${{ vars.ALLURE_PROJECT_ID }}
          ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
        run: |
          if [[ -n "$ALLURE_ENDPOINT" && -n "$ALLURE_PROJECT_ID" && -n "$ALLURE_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping TestOps upload: configure ALLURE_ENDPOINT, ALLURE_PROJECT_ID, and ALLURE_TOKEN."
            echo "TestOps upload skipped: configuration is incomplete." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Download Allure results
        id: download
        if: steps.config.outputs.enabled == 'true'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: allure-results*
          path: allure-results
          merge-multiple: false

      - name: Check for test results
        id: results
        if: steps.download.outcome == 'success'
        run: |
          if [[ -d allure-results ]] && [[ -n "$(find allure-results -type f -name '*-result.json' -print -quit)" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping TestOps upload: no Allure test results were produced."
            echo "TestOps upload skipped: no Allure test results were produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install allurectl
        id: setup
        if: steps.results.outputs.available == 'true'
        continue-on-error: true
        uses: allure-framework/setup-allurectl@5995d206dd0898e2eef096969cccc3b4fb207ad3
        with:
          allurectl-version: 2.23.1

      - name: Upload results to TestOps
        id: upload
        if: steps.setup.outcome == 'success'
        continue-on-error: true
        env:
          ALLURE_ENDPOINT: ${{ vars.ALLURE_ENDPOINT }}
          ALLURE_PROJECT_ID: ${{ vars.ALLURE_PROJECT_ID }}
          ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
          ALLURE_LAUNCH_NAME: ${{ github.workflow }} / ${{ inputs.ref }} / ${{ github.run_number }}.${{ github.run_attempt }}
        run: allurectl upload allure-results

      - name: Summarize TestOps upload
        if: always() && steps.config.outputs.enabled == 'true'
        env:
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          RESULTS_OUTCOME: ${{ steps.results.outcome }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ "$DOWNLOAD_OUTCOME" == failure || "$RESULTS_OUTCOME" == failure || "$SETUP_OUTCOME" == failure || "$UPLOAD_OUTCOME" == failure ]]; then
            echo "::warning::TestOps reporting failed. See the upload job logs; test outcomes are unchanged."
            echo "TestOps reporting failed. See the upload job logs for details." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$UPLOAD_OUTCOME" == success ]]; then
            echo "Allure results uploaded to TestOps. The launch link is in the upload step logs." >> "$GITHUB_STEP_SUMMARY"
          fi
          printf '\n[GitHub workflow run](%s)\n' "$RUN_URL" >> "$GITHUB_STEP_SUMMARY"
