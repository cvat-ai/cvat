name: Upload Allure results to TestOps

on:
  workflow_call:
    secrets:
      ALLURE_TOKEN:
        required: true

permissions:
  actions: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ALLURE_ENDPOINT: ${{ vars.ALLURE_ENDPOINT }}
      ALLURE_PROJECT_ID: ${{ vars.ALLURE_PROJECT_ID }}
      ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
      ALLURE_LAUNCH_NAME: ${{ github.workflow }} / ${{ github.ref_name }} / ${{ github.sha }} / ${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      - name: Check TestOps configuration
        run: |
          if [[ -z "$ALLURE_ENDPOINT" || -z "$ALLURE_PROJECT_ID" || -z "$ALLURE_TOKEN" ]]; then
            echo "::error::Configure ALLURE_ENDPOINT, ALLURE_PROJECT_ID, and ALLURE_TOKEN before uploading to TestOps."
            exit 1
          fi

      - name: Download Allure results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: allure-results*
          path: allure-results
          merge-multiple: false

      - name: Install allurectl
        uses: allure-framework/setup-allurectl@2d89ee0b7ba2f59dbe9849b6df5763cab78e14db # v1.0.3
        with:
          allurectl-version: 2.23.1

      - name: Upload results to TestOps
        run: |
          if [[ ! -d allure-results ]] || [[ -z "$(find allure-results -type f -name '*-result.json' -print -quit)" ]]; then
            echo "::notice::Skipping TestOps upload: no Allure test results were produced."
            echo "TestOps upload skipped: no Allure test results were produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Preserve artifact directories and attachments when grouping by deployment.
          for artifact in allure-results/*/; do
            [[ -d "$artifact" ]] || continue
            artifact=${artifact%/}
            case "${artifact##*/}" in
              allure-results-rest-api-docker|allure-results-rest-api-docker-*|allure-results-e2e-docker-*|allure-results-e2e-base-*) deployment=docker ;;
              allure-results-rest-api-helm|allure-results-e2e-helm) deployment=kubernetes ;;
              *)
                echo "::error::Unknown Allure artifact: ${artifact##*/}. Add its deployment mapping before uploading."
                exit 1
                ;;
            esac
            mkdir -p "allure-upload/$deployment"
            mv "$artifact" "allure-upload/$deployment/"
          done

          ALLURE_LAUNCH_ID=$(allurectl launch create --format ID --no-header)
          if [[ ! "$ALLURE_LAUNCH_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::TestOps did not return a numeric launch ID."
            exit 1
          fi
          upload_status=0
          for deployment in docker kubernetes; do
            results="allure-upload/$deployment"
            if [[ ! -d "$results" ]] || [[ -z "$(find "$results" -type f -name '*-result.json' -print -quit)" ]]; then
              echo "::notice::Skipping $deployment upload: no Allure test results were produced."
              continue
            fi

            # Separate job runs capture each deployment's environment in the shared launch.
            env -u ALLURE_JOB_RUN_ID TEST_DEPLOYMENT="$deployment" allurectl upload "$results" \
              --launch-id "$ALLURE_LAUNCH_ID" \
              --job-uid "$GITHUB_REPOSITORY/$GITHUB_WORKFLOW/$GITHUB_JOB/$deployment" \
              --job-run-uid "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/$GITHUB_JOB/$deployment" || upload_status=1
          done
          echo "TestOps launch: $ALLURE_LAUNCH_ID" >> "$GITHUB_STEP_SUMMARY"
          exit "$upload_status"
